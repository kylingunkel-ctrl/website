<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="googlebot" content="noindex,nofollow">
    <meta name="theme-color" content="#020607">
    <title>FolderStream — Temporarily unavailable</title>
    <link rel="icon" href="assets/img/folderstream-hud-icon.svg">
    <style>
      :root {
        color-scheme: dark;
        --background: #020607;
        --surface: rgba(5, 16, 21, 0.9);
        --line: rgba(51, 234, 255, 0.26);
        --line-strong: rgba(51, 234, 255, 0.58);
        --text: #e9fdff;
        --muted: #a9cbd2;
        --accent: #33eaff;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--background);
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(51, 234, 255, 0.09), transparent 28rem),
          repeating-linear-gradient(0deg, rgba(51, 234, 255, 0.013) 0 1px, transparent 1px 7px),
          var(--background);
        color: var(--text);
        font-family: Bahnschrift, "Segoe UI", Arial, sans-serif;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        pointer-events: none;
      }

      body::before {
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(51, 234, 255, 0.025), transparent);
        mask-image: linear-gradient(180deg, transparent, #000 28%, #000 72%, transparent);
      }

      body::after {
        width: min(42rem, 82vw);
        height: 1px;
        left: 50%;
        top: calc(50% + 13.5rem);
        transform: translateX(-50%);
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.34;
        box-shadow: 0 0 22px rgba(51, 234, 255, 0.24);
      }

      main {
        width: min(100% - 2rem, 48rem);
        padding: clamp(2.5rem, 7vw, 5rem);
        position: relative;
        border: 1px solid var(--line);
        background: linear-gradient(145deg, rgba(7, 25, 30, 0.86), var(--surface));
        box-shadow:
          0 32px 90px rgba(0, 0, 0, 0.48),
          0 0 34px rgba(51, 234, 255, 0.07),
          inset 0 1px rgba(176, 250, 255, 0.04);
        text-align: center;
        clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
      }

      main::before,
      main::after {
        content: "";
        position: absolute;
        width: 4.5rem;
        height: 1px;
        top: -1px;
        background: var(--accent);
        box-shadow: 0 0 14px rgba(51, 234, 255, 0.52);
      }

      main::before {
        left: 2rem;
      }

      main::after {
        right: 2rem;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin: 0 0 clamp(2.2rem, 6vw, 3.4rem);
        color: var(--text);
      }

      .brand img {
        width: 3.25rem;
        height: auto;
        filter: drop-shadow(0 0 10px rgba(51, 234, 255, 0.28));
      }

      .brand span {
        font-size: clamp(1.35rem, 4vw, 1.7rem);
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      h1 {
        max-width: 12ch;
        margin: 0 auto;
        color: var(--text);
        font-size: clamp(2.7rem, 8vw, 5.2rem);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 0.98;
        text-wrap: balance;
      }

      .message {
        max-width: 34rem;
        margin: clamp(1.5rem, 5vw, 2.25rem) auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.16rem);
        line-height: 1.7;
        text-wrap: balance;
      }

      @media (max-width: 520px) {
        body {
          overflow: auto;
        }

        main {
          width: calc(100% - 1.25rem);
          padding: 2.5rem 1rem 3rem;
        }

        .brand {
          margin-bottom: 2.4rem;
        }

        .brand img {
          width: 2.8rem;
        }

        h1 {
          font-size: clamp(2.55rem, 13vw, 3.6rem);
        }

        .message {
          max-width: 18rem;
          font-size: 0.96rem;
          line-height: 1.65;
        }

        body::after {
          top: calc(50% + 12rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="c9979d7a-4e05-4978-8a99-ae5c1a1e30e5"></script>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="FolderStream">
        <img src="assets/img/folderstream-hud-icon.svg" alt="" width="52" height="45">
        <span>FolderStream</span>
      </div>
      <h1>Temporarily unavailable</h1>
      <p class="message">We're making some updates before the next release.<br>Please check back soon.</p>
    </main>
  </body>
</html>
